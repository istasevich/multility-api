server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # 🌍 Next.js landing (Оставляем как есть)
    location / {
        proxy_pass http://landing:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 🧠 FastAPI Worker (Оставляем как есть)
    location /worker/ {
        rewrite ^/worker(/.*)$ $1 break;
        proxy_pass http://worker:8001;
        proxy_set_header Host $host;
    }

    # ⚙️ Laravel Core API (PHP-FPM) - НОВЫЙ БЛОК
    # Этот блок перехватывает ВСЕ запросы, начинающиеся с /api
    location /api {
        # 1. Пытаемся найти статический файл (если он есть, например /api/image.png)
        # 2. Если нет, внутренне перенаправляем запрос на /api/index.php
        #    с оригинальными query-параметрами.
        try_files $uri $uri/ /api/index.php?$args;
    }

    # ⚡️ ОБРАБОТЧИК PHP для /api/
    # Этот блок специально "ловит" перенаправленный запрос /api/index.php...
    location ~ ^/api/index\.php(/|$) {
        fastcgi_split_path_info ^(/api/index\.php)(/.+)$;
        fastcgi_pass core-api:9000;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/src/public/index.php;

        # Передаем остаток пути (напр. /users) в Laravel для роутинга
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}